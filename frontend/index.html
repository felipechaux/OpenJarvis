<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#070b11" />
  <meta name="description" content="OpenJarvis — on-device AI assistant" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="icon" href="/favicon.ico" />
  <title>OpenJarvis</title>
  <!-- The notch window must be see-through from the first frame: without
       this the app's dark background shows as a black box at the top of the
       screen until the notch page's own styles load. -->
  <style>
    html.notch-window, html.notch-window body { background: transparent !important; }
  </style>
  <script>
    if (/\/notch\/?$/.test(location.pathname)) document.documentElement.classList.add('notch-window');
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
